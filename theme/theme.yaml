# Visual identity for both the CV (`cv build-cv`) and the website (`cv build-site`).

# Colors (hex, no leading #), referenced by name in both renderers.
colors:
  navy:      "1A3A52"   # primary: sidebar, headings
  gold:      "B8860B"   # accent: rules, links, logo
  charcoal:  "2D2D2D"   # body text
  warmgray:  "8C8273"   # dates, captions
  lightnavy: "DCE1E6"   # hairlines, borders
  paper:     "FBFAF7"   # page / site background
  sidebartext: "FFFFFF"

# Fonts: `family` matches the cv/fonts/ filenames (LaTeX); web_* map to Fontsource.
fonts:
  display:   # headings, name
    family: CormorantGaramond
    web_family: Cormorant Garamond
    web_package: cormorant-garamond
    weights: [400, 600, 700]
    fallback: Georgia, serif
    letterspace: "2.0"
    latex: { upright: Regular, bold: SemiBold, title: SemiBold, title_bold: Bold }
  text:      # body
    family: Manrope
    web_family: Manrope
    web_package: manrope
    weights: [300, 400, 500, 600]
    fallback: system-ui, sans-serif
    latex: { upright: Light, bold: Regular, italic: Light, medium: Medium, medium_bold: SemiBold }

# Web-only tuning (ignored by LaTeX).
web:
  max_width: 920px
  radius: 2px
